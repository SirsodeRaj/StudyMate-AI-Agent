
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f8fafc;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      max-width: 700px;
      text-align: center;
      padding: 42px 24px;
      border: 1px solid #29344c;
      border-radius: 20px;
      background: #121a2c;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin-bottom: 12px; }
    p { color: #cbd5e1; line-height: 1.7; }
    .tag {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 30px;
      background: #25304a;
      color: #c4b5fd;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">AI-powered learning assistant</span>
    <h1>StudyMate AI</h1>
    <p>
      Learn smarter with your study materials.
      Ask questions and find relevant information from your PDFs.
    </p>
    <p>
      Your StudyMate AI interface is being prepared for deployment.
    </p>
  </main>
</body>
</html>
